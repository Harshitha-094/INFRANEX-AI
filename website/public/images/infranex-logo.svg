<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" fill="none">
  <defs>
    <radialGradient id="fullLogoAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#42D9F5" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#27C6B8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080B12" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="fullSpireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42D9F5" />
      <stop offset="40%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <linearGradient id="fullTowerLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B1728" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="fullTowerDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#060C18" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="fullRoadDeck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#080F1E" />
    </linearGradient>

    <linearGradient id="fullGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="fullAiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42D9F5" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#27C6B8" />
    </linearGradient>
  </defs>

  <g transform="translate(135, -10)">
    <!-- Base Map Ground Plane -->
    <polygon points="10,135 135,170 260,135 135,110" fill="#0B1728" fill-opacity="0.7" stroke="#42D9F5" stroke-width="0.8" stroke-opacity="0.35" />
    <ellipse cx="135" cy="140" rx="60" ry="16" fill="none" stroke="#27C6B8" stroke-width="0.7" stroke-opacity="0.4" stroke-dasharray="3 3" />

    <!-- Buildings -->
    <rect x="52" y="98" width="16" height="38" fill="url(#fullTowerDark)" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.5" />
    <polygon points="72,132 72,75 95,65 95,132" fill="url(#fullTowerLit)" stroke="#42D9F5" stroke-width="0.8" stroke-opacity="0.7" />
    <polygon points="95,65 103,72 103,130 95,132" fill="url(#fullTowerDark)" stroke="#27C6B8" stroke-width="0.6" stroke-opacity="0.5" />
    
    <!-- Central Spire -->
    <polygon points="122,130 122,54 135,38 148,54 148,130" fill="url(#fullSpireGrad)" stroke="#42D9F5" stroke-width="0.9" />
    <line x1="135" y1="38" x2="135" y2="130" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.8" />
    <line x1="135" y1="38" x2="135" y2="18" stroke="#42D9F5" stroke-width="1.3" />
    <circle cx="135" cy="18" r="1.8" fill="#FFFFFF" />

    <!-- East Tower -->
    <polygon points="154,130 154,68 174,58 174,130" fill="url(#fullTowerLit)" stroke="#27C6B8" stroke-width="0.8" stroke-opacity="0.7" />
    <polygon points="174,58 182,65 182,128 174,130" fill="url(#fullTowerDark)" stroke="#27C6B8" stroke-width="0.6" stroke-opacity="0.5" />
    <rect x="186" y="96" width="16" height="38" fill="url(#fullTowerDark)" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.5" />

    <!-- Green Eco-Terraces -->
    <polygon points="70,75 82,70 96,65 96,68 70,78" fill="url(#fullGreenGrad)" />
    <polygon points="152,68 163,63 175,58 175,61 152,71" fill="url(#fullGreenGrad)" />

    <!-- Elevated Highway -->
    <path d="M 20,152 C 60,122 105,155 155,132 C 195,115 235,145 250,154" fill="none" stroke="#080F1E" stroke-width="8" stroke-linecap="round" />
    <path d="M 20,152 C 60,122 105,155 155,132 C 195,115 235,145 250,154" fill="none" stroke="url(#fullRoadDeck)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 20,150 C 60,120 105,153 155,130 C 195,113 235,143 250,152" fill="none" stroke="#42D9F5" stroke-width="1.6" stroke-linecap="round" filter="drop-shadow(0 0 4px #42D9F5)" />
    <path d="M 20,154 C 60,124 105,157 155,134 C 195,117 235,147 250,156" fill="none" stroke="#27C6B8" stroke-width="1.3" stroke-linecap="round" filter="drop-shadow(0 0 3px #27C6B8)" />
    
    <!-- Map Markers -->
    <line x1="75" y1="135" x2="75" y2="124" stroke="#42D9F5" stroke-width="1.2" />
    <circle cx="75" cy="123" r="2.8" fill="#42D9F5" />
    <circle cx="75" cy="123" r="1.1" fill="#FFFFFF" />

    <line x1="185" y1="130" x2="185" y2="120" stroke="#27C6B8" stroke-width="1.2" />
    <circle cx="185" cy="119" r="2.8" fill="#27C6B8" />
    <circle cx="185" cy="119" r="1.1" fill="#FFFFFF" />
  </g>

  <!-- Typography: INFRANEX AI -->
  <text x="235" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="4">INFRANEX</text>
  <text x="352" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="url(#fullAiGrad)" letter-spacing="2">AI</text>

  <!-- Tagline: ಜನಸ್ಪಂದನ -->
  <line x1="150" y1="234" x2="225" y2="234" stroke="url(#fullAiGrad)" stroke-width="1" />
  <text x="270" y="240" text-anchor="middle" font-family="'Noto Sans Kannada', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">ಜನಸ್ಪಂದನ</text>
  <line x1="315" y1="234" x2="390" y2="234" stroke="url(#fullAiGrad)" stroke-width="1" />

  <text x="270" y="260" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#38BDF8" letter-spacing="3" opacity="0.8">INTELLIGENT INFRASTRUCTURE &amp; INCIDENT COMMAND</text>
</svg>
